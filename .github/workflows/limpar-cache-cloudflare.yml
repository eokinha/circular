# Limpa o cache do Cloudflare de circular.eokinha.com.br quando a Vercel termina um deploy de produção.
# Sem isso, o Cloudflare pode entregar por alguns minutos o HTML antigo, que aponta para scripts
# (/_next/static) do deploy anterior. Ver src/lib/cache.ts.
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
# - CLOUDFLARE_ZONE_ID: ID da zona eokinha.com.br (Overview do domínio no Cloudflare)
# - CLOUDFLARE_API_TOKEN: token só com a permissão Zone → Cache Purge → Purge, restrito a essa zona
name: Limpar cache do Cloudflare

on:
  deployment_status:
  workflow_dispatch:

permissions: {}

jobs:
  limpar:
    # A integração da Vercel com o GitHub publica o status do deploy com o ambiente "Production"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Limpar o cache do host
        env:
          ZONA: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$ZONA" ] || [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID ou CLOUDFLARE_API_TOKEN não configurado; cache não foi limpo"
            exit 0
          fi
          # Só o host do Circular: os outros sites da zona não são afetados
          resposta=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONA/purge_cache" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["circular.eokinha.com.br"]}')
          echo "$resposta" | jq '{success, errors}'
          [ "$(echo "$resposta" | jq -r .success)" = "true" ]
